{{- $type := .Get "type" | default (.Get 0) | default "info" -}}
{{- $title := .Get "title" -}}
<div class="callout callout-{{ $type }}">
  <div class="callout-ic" aria-hidden="true">
    {{ if eq $type "warn" }}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    {{ else if eq $type "success" }}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    {{ else }}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    {{ end }}
  </div>
  <div class="callout-body">
    {{ with $title }}
      <div class="callout-title">{{ . }}</div>
    {{ end }}
    <div>
      {{ .Inner | markdownify }}
    </div>
  </div>
</div>
