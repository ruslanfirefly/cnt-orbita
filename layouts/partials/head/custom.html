<!-- Meta tags для SEO -->
<meta name="description" content="{{ .Site.Params.description }}">
<meta name="keywords" content="{{ delimit .Site.Params.keywords ", " }}">
<meta name="author" content="{{ .Site.Params.author.name }}">
<meta name="robots" content="index, follow">
<meta name="revisit-after" content="7 days">
<meta name="language" content="Russian">
<meta name="generator" content="Hugo {{ hugo.Version }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Site.BaseURL }}">
<meta property="og:title" content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:image" content="{{ .Site.BaseURL }}orlogo_main.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:locale" content="ru_RU">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ .Site.BaseURL }}">
<meta property="twitter:title" content="{{ .Site.Title }}">
<meta property="twitter:description" content="{{ .Site.Params.description }}">
<meta property="twitter:image" content="{{ .Site.BaseURL }}orlogo_main.jpg">

<!-- Дополнительные meta tags -->
<meta name="theme-color" content="#2E7D32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{ .Site.Title }}">
<meta name="msapplication-TileColor" content="#2E7D32">
<meta name="msapplication-config" content="/browserconfig.xml">

<!-- Structured Data (JSON-LD) для организации -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Садоводческое некоммерческое товарищество Орбита",
  "url": "https://cnt-orbita.ru",
  "logo": "https://cnt-orbita.ru/orlogo_main.jpg",
  "description": "Садовое некоммерческое товарищество Орбита в Ломоносовском районе Ленинградской области",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Ломоносовский район",
    "addressRegion": "Ленинградская область",
    "addressCountry": "RU"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "email": "{{ .Site.Params.author.email }}"
  }
}
</script>
