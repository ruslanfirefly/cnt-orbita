{{- $req := .Site.Params.requisites -}}
{{- if and $req $req.enabled -}}
<div class="payment-card" role="region" aria-label="Быстрая оплата взносов">
  <div class="pay-left">
    <div class="pay-ic" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><line x1="6" x2="10" y1="15" y2="15"/></svg>
    </div>
    <div class="pay-t">
      <div class="pay-title">Оплата членских и целевых взносов СНТ</div>
      <div class="pay-sub">ИНН {{ $req.inn }} · р/с {{ $req.account }} · ПАО Сбербанк · Быстрая оплата по QR-коду СБП</div>
    </div>
  </div>
  <div class="pay-actions">
    <button class="btn btn-cyan btn-sm btn-show-qr" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><rect width="6" height="6" x="3" y="3" rx="1"/><rect width="6" height="6" x="15" y="3" rx="1"/><rect width="6" height="6" x="3" y="15" rx="1"/><path d="M15 15h3v3h-3z"/><path d="M18 18h3v3h-3z"/><path d="M15 21v-3h3"/></svg>
      QR-код и реквизиты
    </button>
    {{ with $req.paymentTableUrl }}
    <a class="btn btn-ghost btn-sm" href="{{ . }}" target="_blank" rel="noopener">
      Таблица оплат (Google Таблицы) ↗
    </a>
    {{ end }}
  </div>
</div>
{{- end -}}
