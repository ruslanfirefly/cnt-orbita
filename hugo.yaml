    description: 'Выборы Председателя, членов Правления (5 кандидатов) и Ревизионной комиссии, утверждение отчётов и сметы на 2026 год.'
    showProgress: true
    progressLeftLabel: 'Территория СНТ: 334 участка (д. Малое Карлино)'
    progressRightLabel: 'Бюллетени: в Правлении Сб 12:00–14:00'
    progressPercent: 68
    primaryBtn:
      text: 'Порядок голосования 2026'
      url: '/p/nachalo-golosovaniya-2026/'
    secondaryBtn:
      text: 'Список кандидатов (Протокол №31)'
      url: '/p/utverzhden-spisok-kandidatov-2026/'

  # Оперативная сводка инфраструктуры и тарифов (.status-bar)
  statusBar:
    enabled: true
    items:
      - dot: 'ok'
        label: 'Тарифы АО «ПСК» (до 1500 кВт·ч)'
        value: 'День 7,25 ₽ · Ночь 3,95 ₽ · Единый 6,59 ₽'
      - dot: 'ok'
        label: 'Передача показаний света'
        value: 'С 1 по 25 число · 8 (812) 678-96-00'
      - dot: 'info'
        label: 'Аварийная «Ленэнерго»'
        value: 'Отключение света: 8 (800) 220-02-20'
      - dot: 'info'
        label: 'Приём в доме Правления'
        value: 'Суббота 12:00–14:00 · Витер А.Д.'

  # Главная страница
  home:
    type: list
  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
  
  # Боковая панель (фоллбек темы)
  sidebar:
    avatar:
      enabled: true
      src: orlogo_main.jpg
      local: true
    emoji: "🏡"
    subtitle: "Ленинградская область, Ломоносовский район, Виллозское городское поселение."
  
  # Цветовая схема
  colorScheme:
    toggle: true
    default: "auto"
  
  # Обработка изображений
  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true
  
  # Футер
  footer:
    since: 2023
    customText: 'Садовое некоммерческое товарищество "Орбита"'
  
  # Комментарии
  comments:
    enabled: false
  
  # Виджеты (для темы)
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
            limit: 5
      - type: categories
        params:
            limit: 30
    page:
      - type: search
      - type: categories
  
  # Статьи
  article:
    math: false
    toc: true
    readingTime: true
    license:
      enabled: false

# Главное меню сайта (строго по новому дизайну orbita-redesign.html)
menu:
  main:
    - identifier: vznosy
      name: "Взносы"
      url: "/vznosy/"
      weight: 10
      params:
        icon: coins
    - identifier: electro
      name: "Электроэнергия"
      url: "/electro/"
      weight: 20
      params:
        icon: bolt
    - identifier: dorogi
      name: "Дороги"
      url: "/p/sbor-sredstv-na-remont-dorogi-2025/"
      weight: 30
      params:
        icon: road
    - identifier: documents
      name: "Документы"
      url: "/documents/"
      weight: 40
      params:
        icon: file-check
    - identifier: pravlenie
      name: "Правление"
      url: "/pravlenie/"
      weight: 50
      params:
        icon: user
    - identifier: post
      name: "Новости"
      url: "/post/"
      weight: 60
      params:
        icon: news

# Пагинация
pagination:
    pagerSize: 15

# Постоянные ссылки (100% обратная совместимость)
permalinks:
    post: /p/:slug/
    page: /:slug/

# Разметка Goldmark
markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4

# Sitemap
sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.8

# Минификация
minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      keepWhitespace: false

# Безопасность
security:
  exec:
    allow:
      - "^dart-sass-embedded$"
      - "^go run.*"
      - "^npx.*"
      - "^postcss.*"
