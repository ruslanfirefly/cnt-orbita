  keywords: ["СНТ", "Орбита", "садовое товарищество", "Ломоносовский район", "Виллозское городское поселение", "Малое Карлино", "дачный участок", "садоводство"]
  author:
    name: "СНТ «Орбита»"
    email: "info@cnt-orbita.ru"
  images: ["orlogo_main.jpg"]
  favicon: "logo_fav.png"
  
  # Общие реквизиты и контакты СНТ
  snt:
