baseURL: 'https://cnt-orbita.ru/'
languageCode: 'ru-RU'
title: 'Садоводческое некоммерческое товарищество "Орбита"'
theme: "hugo-theme-stack"
DefaultContentLanguage: "ru"
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: false

# SEO параметры
params:
  description: "Официальный сайт Садового некоммерческого товарищества Орбита. Новости, документы, собрания и важная информация для членов СНТ."
  keywords: ["СНТ", "Орбита", "садовое товарищество", "Ломоносовский район", "Виллозское городское поселение", "дачный участок", "садоводство"]
  author:
    name: "СНТ Орбита"
    email: "info@cnt-orbita.ru"
  images: ["orlogo_main.jpg"]
  favicon: "logo_fav.png"
  
  # Главная страница
  home:
    type: list
  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
  
  # Боковая панель
  sidebar:
    avatar:
      enabled: true
      src: orlogo_main.jpg
      local: true
    emoji: "🏡"
    subtitle: "Ленинградская область, Ломоносовский район, Виллозское городское поселение."
  
  # Цветовая схема
  colorScheme:
    toggle: true
    default: "auto"
  
  # Обработка изображений
  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true
  
  # Футер
  footer:
    since: 2023
    customText: 'Садовое некоммерческое товарищество "Орбита"'
  
  # Комментарии
  comments:
    enabled: false
  
  # Виджеты
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
            limit: 5
      - type: categories
        params:
            limit: 30
    page:
      - type: search
      - type: categories
  
  # Статьи
  article:
    math: false
    toc: false
    readingTime: true
    license:
      enabled: false
      default: "Licensed under CC BY-NC-SA 4.0"

# Пагинация
pagination:
    pagerSize: 15

# Постоянные ссылки
permalinks:
    post: /p/:slug/
    page: /:slug/

# Разметка
markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 1
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4

# Sitemap
sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.8

# Минификация
minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      keepWhitespace: false

# Безопасность
security:
  exec:
    allow:
      - "^dart-sass-embedded$"
      - "^go run.*"
      - "^npx.*"
      - "^postcss.*"