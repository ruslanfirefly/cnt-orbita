<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка адаптивности — СНТ «Орбита»</title>
<style>
  body{
    margin:0;background:#0b1220;font:14px -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:#e9eff9;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  .bar{
    display:flex;align-items:center;gap:10px;padding:10px 16px;
    background:#131d31;border-bottom:1px solid #223048;flex-wrap:wrap;
  }
  .bar b{font-size:14px;margin-right:6px;display:flex;align-items:center;gap:6px;color:#f1f5f9}
  .btn-group{display:flex;align-items:center;gap:6px}
  .bar button{
    background:#11293d;color:#e9eff9;border:1px solid #223048;border-radius:8px;
    padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;min-height:36px;
    transition:background .15s,border-color .15s,color .15s;
  }
  .bar button:hover{border-color:#22d3ee;color:#22d3ee}
  .bar button.active{background:#22d3ee;color:#081426;border-color:#22d3ee;font-weight:700}
  .page-select{
    background:#18253d;color:#f8fafc;border:1px solid #38bdf8;border-radius:8px;
    padding:7px 12px;font-size:13px;font-weight:700;min-height:36px;cursor:pointer;
  }
  .tools{margin-left:auto;display:flex;align-items:center;gap:12px}
  .tools button{
    background:#18253d;border-color:#2e4162;display:inline-flex;align-items:center;gap:8px;
  }
  .tools button:hover{background:#20314f;border-color:#22d3ee}
  .tools button svg{width:16px;height:16px}
  .w{font-size:13px;color:#94a3b8;font-weight:700;min-width:64px;text-align:right}
  .frame{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:16px;overflow:auto;min-height:0;
  }
  .device{
    position:relative;background:#000;border-radius:28px;
    box-shadow:0 24px 70px rgba(0,0,0,.65);padding:10px;
    border:1px solid #223048;transition:width .25s ease;max-width:100%;
  }
  .device.desktop{border-radius:12px;padding:6px}
  iframe{border:0;border-radius:20px;background:#fff;display:block;transition:width .25s ease}
  .device.desktop iframe{border-radius:8px}
  .hint{
    padding:8px 16px;color:#94a3b8;font-size:12.5px;text-align:center;
    background:#0f172a;border-top:1px solid #1e293b;
  }
</style>
</head>
<body>
  <div class="bar">
    <b>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
      Шаблон Hugo:
    </b>
    <select class="page-select" id="pageSelect" aria-label="Выбор страницы-шаблона Hugo">
      <option value="orbita-redesign.html">1. Главная (index.html)</option>
      <option value="orbita-article.html">2. Новость / Протокол (single.html)</option>
      <option value="orbita-news-list.html">3. Архив и рубрики (list.html)</option>
      <option value="orbita-search.html">4. Умный поиск (search.html)</option>
      <option value="orbita-documents.html">5. Документы, Свет, Правление (page.html)</option>
    </select>
    <div class="btn-group">
      <button data-w="320" title="Компактный смартфон (320px)">320 px</button>
      <button data-w="390" class="active" title="Смартфон iPhone/Android (390px)">390 px</button>
      <button data-w="768" title="Планшет iPad (768px)">768 px</button>
      <button data-w="1024" title="Планшет горизонтально / компактный ноутбук (1024px)">1024 px</button>
      <button data-w="1200" title="Ноутбук / Desktop (1200px)">1200 px</button>
      <button data-w="1920" title="Широкий экран Full HD (1920px)">1920 px</button>
    </div>
    <div class="tools">
      <button id="toggleFont" title="Переключить режим крупного шрифта А+ во фрейме">
        <b>А+</b> Крупный шрифт
      </button>
      <button id="toggleTheme" title="Переключить тему во фрейме">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        Тема: светлая/тёмная
      </button>
      <span class="w" id="w">390 px</span>
    </div>
  </div>
  <div class="frame">
    <div class="device" id="device">
      <iframe id="f" src="orbita-redesign.html" title="Прототип редизайна СНТ «Орбита»"></iframe>
    </div>
  </div>
  <div class="hint">Прототип во фрейме: кнопки меняют ширину (320–1920 px), поддерживаются режим крупного шрифта «А+» и переключение темы.</div>
<script>
  var f=document.getElementById('f'),
      wEl=document.getElementById('w'),
      device=document.getElementById('device'),
      themeBtn=document.getElementById('toggleTheme'),
      fontBtn=document.getElementById('toggleFont'),
      pageSelect=document.getElementById('pageSelect');

  pageSelect.addEventListener('change',function(){
    f.src=pageSelect.value;
  });

  function setW(w){
    var bs=document.querySelectorAll('.btn-group button');
    for(var i=0;i<bs.length;i++){
      bs[i].classList.toggle('active',+bs[i].dataset.w===w);
    }
    f.style.width=w+'px';
    f.style.height=Math.max(480,window.innerHeight-170)+'px';
    device.classList.toggle('desktop',w>=1000);
    wEl.textContent=w+' px';
  }

  var bs=document.querySelectorAll('.btn-group button');
  for(var i=0;i<bs.length;i++){
    (function(b){
      b.addEventListener('click',function(){setW(+b.dataset.w)});
    })(bs[i]);
  }

  window.addEventListener('resize',function(){
    var w=parseInt(f.style.width,10)||390;
    f.style.height=Math.max(480,window.innerHeight-170)+'px';
  });

  /* Управление режимом крупного шрифта А+ внутри iframe */
  fontBtn.addEventListener('click',function(){
    try{
      var doc=f.contentDocument||f.contentWindow.document;
      var fBtn=doc.getElementById('fontBtn');
      if(fBtn){
        fBtn.click();
      }else{
        var cur=doc.documentElement.dataset.font==='large'?'normal':'large';
        doc.documentElement.dataset.font=cur;
      }
      fontBtn.classList.toggle('active',doc.documentElement.dataset.font==='large');
    }catch(e){
      console.warn('Iframe font toggle error:',e);
    }
  });

  /* Управление темой внутри iframe */
  themeBtn.addEventListener('click',function(){
    try{
      var doc=f.contentDocument||f.contentWindow.document;
      var tBtn=doc.getElementById('themeBtn');
      if(tBtn){
        tBtn.click();
      }else{
        var cur=doc.documentElement.dataset.theme==='dark'?'light':'dark';
        doc.documentElement.dataset.theme=cur;
      }
    }catch(e){
      console.warn('Iframe theme toggle error:',e);
    }
  });

  setW(390);
</script>
</body>
</html>
